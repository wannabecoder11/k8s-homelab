apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: all-apps
  namespace: argocd

spec:
  project: default
  source:
    repoURL: https://github.com/wannabecoder11/k8s-homelab.git
    targetRevision: HEAD
    path: apps/individual/  # Folder with MANY app.yaml files
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true