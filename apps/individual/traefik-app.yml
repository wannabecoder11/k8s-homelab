apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  sources:  # ← Fixed: plural + array
  - repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 3.5.3
    #path: traefik  # ← Fixed: path to chart folder (not chart:)
  helm:  # ← Your local values
    releaseName: traefik
    valueFiles:
    - helm/traefik/values.yaml  # ← Path relative to YOUR repo root
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
