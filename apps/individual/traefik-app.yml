apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  sources:  # ← Fixed: plural + array
  - repoURL: https://github.com/traefik/traefik-helm-chart.git
    targetRevision: main
    path: traefik  # ← Fixed: path to chart folder (not chart:)
  helm:  # ← Your local values
    valueFiles:
    - helm/traefik/values.yaml  # ← Path relative to YOUR repo root
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
