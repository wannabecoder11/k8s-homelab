apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: erpnext
  namespace: argocd
spec:
  project: default
  sources:  # ← Fixed: plural + array
    - repoURL: https://helm.erpnext.com
      chart: erpnext
      targetRevision: "8.0.0"
      helm:  # ← Your local values
        releaseName: erpnext
        valueFiles:
        - $values/helm/erpnext-values.yaml  # ← Path relative to YOUR repo root
    - repoURL: https://github.com/wannabecoder11/k8s-homelab.git
      targetRevision: "HEAD"
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: erpnext
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
