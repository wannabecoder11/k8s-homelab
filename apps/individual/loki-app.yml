apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-loki
  namespace: argocd
spec:
  project: default
  sources:
  - repoURL: https://grafana.github.io/helm-charts
    targetRevision: "6.43.0"
    chart: loki
    helm:
      releaseName: loki-install
      valueFiles:
        - $values/helm/grafana-stack/loki-values.yml
  - repoURL: https://github.com/wannabecoder11/k8s-homelab.git
    targetRevision: "HEAD"
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
