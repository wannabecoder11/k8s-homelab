apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: base-default-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wannabecoder11/k8s-homelab.git
    targetRevision: HEAD
    path: base/kube-system
  destination:
    server: https://kubernetes.default.svc
    namespace: default  # ← CHANGE if base/ deploys to specific namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
