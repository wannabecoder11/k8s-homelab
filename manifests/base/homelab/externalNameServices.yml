---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-cors
  namespace: homelab
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - OPTIONS
      - PUT
    accessControlAllowHeaders:
      - "*"
    accessControlAllowOriginList:
      - homer.rrk.duckdns.org
      - hp.rrk.duckdns.org
      - immich.rrk.duckdns.org
    customResponseHeaders:
      Access-Control-Allow-Origin: homer.rrk.duckdns.org
