---
apiVersion: v1
kind: Service
metadata:
  namespace: homelab
  name: home-assistant-service
spec:
  type: ExternalName
  externalName: 192.168.1.3
  ports:
    - port: 8123 # Or the destination port
      targetPort: 8123

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant-ingress
  namespace: homelab
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: homelab-traefik-cors@kubernetescrd

spec:
  rules:
    - host: ha.rrk.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-assistant-service
                port:
                  number: 8123

---
apiVersion: v1
kind: Service
metadata:
  name: pve-service
  namespace: homelab
spec:
  type: ExternalName
  externalName: 192.168.1.3
  ports:
    - port: 8006 # Or the destination port
      targetPort: 8006

# using ingressRoute traefik CRD as insecureSkipVerify is complicated in k8s native ingress object
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: pvetransport
  namespace: homelab
spec:
  serverName: 192.168.1.3
  insecureSkipVerify: true

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  namespace: homelab
  name: pve-ingress
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`pve.rrk.duckdns.org`)"

      kind: Rule
      services:
        - name: pve-service
          port: 8006
          scheme: https
          passHostHeader: true
          namespace: homelab
          serversTransport: pvetransport

