---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nebula
  labels:
    app: nebula
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nebula
  template:
    metadata:
      labels:
        app: nebula
    spec:
      containers:
      - name: nebula-sync
        image: ghcr.io/lovelaze/nebula-sync:latest
        envFrom:
          - secretRef:
              name: pihole-nebula-sync
        env:
          - name: FULL_SYNC
            value: "true"
          - name: RUN_GRAVITY
            value: "true"
          - name: CRON
            value: "*/5 * * * *"
